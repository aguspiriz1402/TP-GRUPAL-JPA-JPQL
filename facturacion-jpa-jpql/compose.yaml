services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: facturacion
      POSTGRES_USER: facturacion
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD antes de iniciar PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - facturacion_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facturacion -d facturacion"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  facturacion_data:
